[project]
name = "tedlar-lead-agent"
version = "0.1.0"
description = "AI lead generation & outreach pipeline for DuPont Tedlar Graphics & Signage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "tenacity>=9.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

# A dependency group, not an optional extra: `uv sync` installs groups by
# default, so a fresh clone gets the test tooling without an extra flag.
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the framework's own idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
